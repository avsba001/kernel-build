# This is a basic workflow to help you get started with Actions

name: 6.18-内核构建

# Controls when the workflow will run

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DEB_BUILD_OPTIONS: nocheck
      KERNEL_LOCALVERSION: -cloud
      KBUILD_BUILD_USER: actions-kernel
      KBUILD_BUILD_HOST: github-actions
      LLVM_ARGS: LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld
      KCFLAGS_OPT: -march=x86-64-v3 -O3 -ffunction-sections -fdata-sections -Wno-error
      LDFLAGS_OPT: -Wl,--gc-sections -Wl,-O1

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        
      - name: 最大化可用空间
        run: |
          echo "-- Dotnet"
          sudo rm -rf /usr/share/dotnet
          echo "-- Android"
          sudo rm -rf /usr/local/lib/android
          echo "-- Haskell"
          sudo rm -rf /opt/ghc
          echo "-- CodeQL"
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          df -h
          
#      - name: 最大化可用空间
#        # NOTE: 增加19G可用空间，编译时间增加3分钟
#        uses: justinthelaw/maximize-github-runner-space@main
#        with:
#          skip-components: java,browsers,docker-engine
#          swapfile-size: 2G

      - name: 显示系统信息 & 设置时区
        run: |
          echo -e "Total CPU cores\t: $(nproc)"
          cat /proc/cpuinfo
          cat /proc/meminfo
          sudo timedatectl set-timezone Asia/Shanghai

      - name: 安装 LLVM/Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wget lsb-release gnupg ca-certificates
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21 all
          echo "PATH=/usr/lib/llvm-21/bin:$PATH" >> $GITHUB_ENV

      - name: 安装依赖 dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-mark hold grub-efi-amd64-signed firefox snapd mysql* || true
          sudo apt-get autoremove -y --purge
          sudo apt-get clean
          sudo -E apt-get -y update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex \
            libssl-dev libelf-dev libncurses-dev \
            libdw-dev debhelper debhelper-compat dpkg-dev devscripts \
            linux-libc-dev linux-firmware curl wget \
            dwarves pahole fakeroot git pkg-config perl \
            rsync xz-utils zstd binutils cpio initramfs-tools
          sudo -E systemctl daemon-reload || true
          sudo apt-get autoremove -y --purge
          sudo apt-get clean

      - name: 下载 XanMod 内核
        run: |
          git clone --depth=1 --branch 6.18 https://gitlab.com/xanmod/linux.git kernel


      - name: 从仓库更新 config 配置
        run:  |
          cd kernel
          cp ../config-6.x.sh .
          chmod +x config-6.x.sh
          cp CONFIGS/x86_64/config .config
          ./config-6.x.sh
          make ${LLVM_ARGS} olddefconfig

          
      - name: 导出最终内核配置 .config
        run: |
          mkdir -p artifacts
          cp kernel/.config artifacts/config-6.18-clang-${{ github.run_id }}

      - name: 构建 kernel vmlinux
        run: |
          cd kernel
          make -j$(nproc) ${LLVM_ARGS} \
            vmlinux modules_prepare \
            KCFLAGS="${KCFLAGS_OPT}" \
            LDFLAGS="${LDFLAGS_OPT}"

      - name: 构建内核模块 kernel modules_prepare
        run: |
          cd kernel
          make -j$(nproc) ${LLVM_ARGS} \
            modules_prepare \
            KCFLAGS="${KCFLAGS_OPT}" \
            LDFLAGS="${LDFLAGS_OPT}"

      - name: 构建内核软件包 kernel deb packages
        run: |
          cd kernel
          KDEB_COMPRESS=xz \
          make -j$(nproc) ${LLVM_ARGS} \
            bindeb-pkg \
            LOCALVERSION=${KERNEL_LOCALVERSION} \
            KCFLAGS="${KCFLAGS_OPT}" \
            LDFLAGS="${LDFLAGS_OPT}"

      - name: 查看文件目录
        run: |
          cd kernel
          ls -al
          
      - name: 归档文件 kernel artifacts
        run: |
          mkdir -p artifacts
          mv linux-image-*.deb artifacts/
          mv linux-headers-*.deb artifacts/

      - name: 发布
        uses: softprops/action-gh-release@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: xanmod-cloud-6.18-${{ github.run_id }}
          name: XanMod Cloud 6.18-内核 v3
          files: artifacts/*
          overwrite_files: true

      - name: 删除以往工作流
        if: always()
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 30
          keep_minimum_runs: 5

      - name: 删除旧的发布文件
        if: always()
        uses: dev-drprasad/delete-older-releases@master
        with:
          keep_latest: 5
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
