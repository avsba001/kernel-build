name: 6.12-内核构建

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DEB_BUILD_OPTIONS: nocheck
      KERNEL_LOCALVERSION: -cloud
      CC: clang
      CXX: clang++

    steps:
      # ----------------------
      # checkout
      # ----------------------
      - name: Checkout
        uses: actions/checkout@v6

      # ----------------------
      # 清理空间
      # ----------------------
      - name: 最大化可用空间
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      # ----------------------
      # 基础信息
      # ----------------------
      - name: 系统信息
        run: |
          nproc
          cat /proc/cpuinfo | head
          sudo timedatectl set-timezone Asia/Shanghai

      # ----------------------
      # LLVM
      # ----------------------
			- name: 安装 LLVM/Clang
			  run: |
			    sudo apt-get update
			    sudo apt-get install -y wget lsb-release gnupg ccache

			    wget https://apt.llvm.org/llvm.sh
			    chmod +x llvm.sh
			    sudo ./llvm.sh 21 all

			    # 关键：立即暴露工具链（解决 olddefconfig / build 阶段缺工具问题）
			    sudo ln -sf /usr/lib/llvm-21/bin/ld.lld /usr/bin/ld.lld
			    sudo ln -sf /usr/lib/llvm-21/bin/llvm-ar /usr/bin/llvm-ar
			    sudo ln -sf /usr/lib/llvm-21/bin/llvm-nm /usr/bin/llvm-nm
			    sudo ln -sf /usr/lib/llvm-21/bin/llvm-strip /usr/bin/llvm-strip

			    # 验证（必须在当前 step 内完成）
			    ld.lld --version
			    llvm-ar --version
			    clang --version

			    # PATH 仅用于后续 step
			    echo "PATH=/usr/lib/llvm-21/bin:$PATH" >> $GITHUB_ENV
			    echo "PATH=/usr/lib/ccache:$PATH" >> $GITHUB_ENV
      # ----------------------
      # ccache cache（核心加速）
      # ----------------------
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-xanmod-6.12-${{ github.ref_name }}
          restore-keys: |
            ccache-xanmod-6.12-

      - name: 初始化 ccache
        run: |
          ccache -M 20G
          ccache -s
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          echo "CCACHE_COMPRESS=1" >> $GITHUB_ENV

      # ----------------------
      # 依赖安装
      # ----------------------
      - name: 安装依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex \
            libssl-dev libelf-dev libncurses-dev \
            libdw-dev debhelper dpkg-dev devscripts \
            linux-libc-dev linux-firmware curl wget \
            dwarves pahole fakeroot git pkg-config perl \
            rsync xz-utils zstd binutils cpio

      # ----------------------
      # 下载 kernel
      # ----------------------
      - name: 下载 XanMod 内核
        run: |
          git clone --depth=1 --branch 6.12 https://gitlab.com/xanmod/linux.git kernel

      # ----------------------
      # config
      # ----------------------
      - name: 配置内核
        run: |
          cd kernel
          cp ../config-6.12.sh .
          chmod +x config-6.12.sh
          cp CONFIGS/xanmod/gcc/config_x86-64-v3 .config
          ./config-6.12.sh

          make LLVM=1 LLVM_IAS=1 olddefconfig

      # ----------------------
      # build kernel
      # ----------------------
      - name: 编译内核
        run: |
          cd kernel

          make -j$(nproc) \
            LLVM=1 LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            KCFLAGS="-march=x86-64-v3 -O3 -ffunction-sections -fdata-sections -mllvm -enable-machine-outliner -Wno-error"

      # ----------------------
      # deb package
      # ----------------------
      - name: 构建 deb 包
        run: |
          cd kernel

          KDEB_COMPRESS=xz make -j$(nproc) \
            LLVM=1 LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            bindeb-pkg \
            LOCALVERSION=${KERNEL_LOCALVERSION} \
            KCFLAGS="-march=x86-64-v3 -O3 -ffunction-sections -fdata-sections -mllvm -enable-machine-outliner -Wno-error"

      # ----------------------
      # artifacts
      # ----------------------
      - name: 收集产物
        run: |
          mkdir -p artifacts
          mv linux-image-*.deb artifacts/ || true
          mv linux-headers-*.deb artifacts/ || true
          cp kernel/.config artifacts/config-${{ github.run_id }}

      # ----------------------
      # release
      # ----------------------
      - name: 发布
        uses: softprops/action-gh-release@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: xanmod-cloud-6.12-${{ github.run_id }}
          name: XanMod Cloud 6.12 optimized stable
          files: artifacts/*
          overwrite_files: true

      # ----------------------
      # cleanup
      # ----------------------
      - name: 删除旧 workflow
        if: always()
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 30
          keep_minimum_runs: 5

      - name: 删除旧 release
        if: always()
        uses: dev-drprasad/delete-older-releases@master
        with:
          keep_latest: 5
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
