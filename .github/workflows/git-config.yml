name: 同步config至v2分支

on:
  push:
    branches:
      - v3
    paths:
      - "config-6.x.sh"
      - "config-7.x.sh"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch branches
        run: |
          git fetch origin v2
          git fetch origin v3

      - name: 切换到 v2 分支
        run: |
          git checkout v2

      - name: 从 v3 同步 config 文件
        run: |
          git checkout origin/v3 -- config-6.x.sh config-7.x.sh

      - name: 提交变更
        run: |
          git add config-6.x.sh config-7.x.sh

          if git diff --cached --quiet; then
            echo "No config changes to sync."
            exit 0
          fi

          git commit -m "Sync config files from v3"
          git push origin v2
