name: 校正 scripts/config 参数值

on:
  push:
    branches:
      - v3
    paths:
      - "config-6.x.sh"
      - "config-7.x.sh"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout v2
        uses: actions/checkout@v4
        with:
          ref: v2
          fetch-depth: 0

      - name: 配置 Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync config from v3
        run: |
          git fetch origin v3
          git checkout origin/v3 -- config-6.x.sh config-7.x.sh

      - name: Fix CONFIG_X86_64_VERSION value only
        run: |
          for file in config-6.x.sh config-7.x.sh; do

            echo "processing $file"

            while IFS= read -r line; do

              if [[ "$line" == scripts/config*CONFIG_X86_64_VERSION* ]]; then

                # 提取最后一个字段（值）
                value=$(echo "$line" | awk '{print $NF}')

                if [ "$value" != "2" ]; then
                  echo "fixing: $line"

                  # 替换最后一个字段为 2（保留整行结构）
                  new_line=$(echo "$line" | awk '{$NF=2; print}')

                  sed -i "s|^$line$|$new_line|" "$file"
                fi

              fi

            done < "$file"

          done

      - name: Commit changes
        run: |
          git add config-6.x.sh config-7.x.sh

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Fix CONFIG_X86_64_VERSION value to 2"
          git push origin v2
