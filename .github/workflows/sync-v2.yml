name: 同步config + 强制修正参数

on:
  push:
    branches:
      - v3
    paths:
      - "config-6.x.sh"
      - "config-7.x.sh"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. 检出 v2
      # =========================
      - name: Checkout v2
        uses: actions/checkout@v4
        with:
          ref: v2
          fetch-depth: 0

      - name: 配置 Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # =========================
      # 2. 同步 v3 的 config 文件
      # =========================
      - name: Sync config files from v3
        run: |
          git fetch origin v3
          git checkout origin/v3 -- config-6.x.sh config-7.x.sh

      # =========================
      # 3. 强制修正 CONFIG_X86_64_VERSION = 2
      # =========================
      - name: Force CONFIG_X86_64_VERSION = 2
        run: |
          for file in config-6.x.sh config-7.x.sh; do

            echo "processing $file"

            # 删除所有历史写法（= / 空格 / 注释）
            sed -i '/CONFIG_X86_64_VERSION/d' "$file"

            # 统一写入标准格式
            echo "CONFIG_X86_64_VERSION=2" >> "$file"

          done

      # =========================
      # 4. 强制修正 MNATIVE_AMD
      # =========================
      - name: Disable CONFIG_MNATIVE_AMD
        run: |
          for file in config-6.x.sh config-7.x.sh; do

            sed -i '/CONFIG_MNATIVE_AMD/d' "$file"
            echo "# CONFIG_MNATIVE_AMD is not set" >> "$file"

          done

      # =========================
      # 5. 设置 cache shift
      # =========================
      - name: Set CONFIG_X86_INTERNODE_CACHE_SHIFT=6
        run: |
          for file in config-6.x.sh config-7.x.sh; do

            sed -i '/CONFIG_X86_INTERNODE_CACHE_SHIFT/d' "$file"
            echo "CONFIG_X86_INTERNODE_CACHE_SHIFT=6" >> "$file"

          done

      # =========================
      # 6. 提交变更
      # =========================
      - name: Commit changes
        run: |
          git add config-6.x.sh config-7.x.sh

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Sync v3 configs + enforce CONFIG policy (v2)"
          git push origin v2
