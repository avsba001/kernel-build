name: 清理重复内核发布

on:
  workflow_call:
    inputs:
      version:
        description: 仅清理指定内核系列
        type: string
        default: ''
      profile:
        description: 仅清理指定 CPU 配置
        type: string
        default: ''
      dry_run:
        description: 仅预览，不删除
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      dry_run:
        description: 仅预览，不删除
        type: boolean
        default: true
  schedule:
    - cron: '0 3 * * 0'  # 每周日 03:00 UTC（约北京时间周日 11:00）

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    concurrency:
      group: kernel-release-cleanup
      cancel-in-progress: false
    steps:
      - name: 检出清理脚本
        uses: actions/checkout@v6
      - name: 每个内核系列与完整 CPU 配置仅保留最新发布
        uses: actions/github-script@v8
        env:
          CLEANUP_VERSION: ${{ inputs.version }}
          CLEANUP_PROFILE: ${{ inputs.profile }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        with:
          script: |
            const { cleanup } = require('./scripts/cleanup-releases.cjs');
            await cleanup({
              github, context, core,
              version: process.env.CLEANUP_VERSION || '',
              profile: process.env.CLEANUP_PROFILE || '',
              dryRun: process.env.DRY_RUN === 'true',
            });
