name: 清理旧版内核发布

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'  # 每周日 03:00 UTC（约北京时间周日 11:00）

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: 按内核版本与配置组合清理旧发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          KEEP=2

          gh api "repos/${REPOSITORY}/releases" --paginate > releases.json

          jq -r '
            .[] |
            {
              name,
              tag: .tag_name,
              created: .created_at,
              group: (
                (.name | capture("(?<k>[0-9.]+).*?(v[23])") | "\(.k)-\(.v)")
              )
            }
          ' releases.json > parsed.json

          jq -r '.group' parsed.json | sort -u | while read -r GROUP; do
            echo "清理分组：$GROUP"

            jq -r --arg g "$GROUP" '
              select(.group == $g)
              | [.created, .tag]
              | @tsv
            ' parsed.json \
            | sort -r \
            | tail -n +$((KEEP+1)) \
            | while IFS=$'\t' read -r CREATED TAG; do
              [[ -n "$TAG" ]] || continue
              echo "删除旧 Release：$TAG"
              gh release delete "$TAG" -R "$REPOSITORY" --cleanup-tag -y
            done
          done

      - name: 清理没有对应 Release 的旧构建 tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mapfile -t release_tags < <(
            gh api --paginate "repos/${REPOSITORY}/releases" --jq '.[].tag_name' | sort -u
          )
          mapfile -t build_tags < <(
            gh api --paginate "repos/${REPOSITORY}/git/matching-refs/tags/xanmod-cloud-" \
              --jq '.[].ref | sub("^refs/tags/"; "")'
          )

          for tag in "${build_tags[@]}"; do
            [[ -n "$tag" ]] || continue
            if printf '%s\n' "${release_tags[@]}" | grep -Fxq -- "$tag"; then
              echo "保留有对应 Release 的 tag：$tag"
              continue
            fi

            echo "删除无对应 Release 的旧 tag：$tag"
            gh api --method DELETE "repos/${REPOSITORY}/git/refs/tags/${tag}"
          done
