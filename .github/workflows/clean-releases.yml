name: Cleanup old releases

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Delete old releases by group
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEEP=2

          gh api repos/${{ github.repository }}/releases --paginate > releases.json

          jq -r '.[].name' releases.json | sort -u | while read -r GROUP; do
            echo "========================="
            echo "Group: $GROUP"
            echo "========================="

            jq -r --arg g "$GROUP" '
              .[]
              | select(.name == $g)
              | [.created_at, .tag_name]
              | @tsv
            ' releases.json \
            | sort -r \
            | tail -n +$((KEEP+1)) \
            | while IFS=$'\t' read -r CREATED TAG
            do
              echo "Deleting $TAG"
              gh release delete "$TAG" --cleanup-tag -y
            done
          done